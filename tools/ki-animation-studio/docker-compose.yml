version: "3.9"
services:
  ki-animation-studio:
    build: .
    container_name: ki-animation-studio
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      - KI_STUDIO_PORT=8090
      - OMP_NUM_THREADS=16
    cpus: 16
    mem_limit: 24g
    volumes:
      - ./renders:/app/renders
