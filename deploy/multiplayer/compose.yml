# Private persistence for a future authoritative server; no public database port.
services:
  db:
    image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    restart: unless-stopped
    environment:
      POSTGRES_DB: ki_multiplayer
      POSTGRES_USER: ki_owner
      POSTGRES_PASSWORD_FILE: /run/secrets/owner_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets: [owner_password]
    volumes:
      - database:/var/lib/postgresql/data
    networks: [private]
    shm_size: 128m
    mem_limit: 512m
    cpus: 1.0
    command: [postgres, -c, shared_buffers=128MB, -c, max_connections=40, -c, work_mem=4MB]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U ki_owner -d ki_multiplayer']
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
secrets:
  owner_password:
    file: ./secrets/owner_password
volumes:
  database:
networks:
  private:
    internal: true
