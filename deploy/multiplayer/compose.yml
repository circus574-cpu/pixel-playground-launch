# Private persistence for a future authoritative server; no public database port.
services:
  db:
    image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    restart: unless-stopped
    environment:
      POSTGRES_DB: ki_multiplayer
      POSTGRES_USER: ki_owner
      POSTGRES_PASSWORD_FILE: /run/secrets/owner_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets: [owner_password]
    volumes:
      - database:/var/lib/postgresql/data
    networks: [private]
    shm_size: 256m
    mem_limit: 1024m
    cpus: 2.0
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - max_connections=120
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - wal_compression=lz4
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - jit=off
      - -c
      - track_io_timing=on
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U ki_owner -d ki_multiplayer"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }

  game-server:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ../..:/app:ro
    ports:
      - "7420:7420"
    environment:
      NODE_ENV: production
      GAME_SERVER_PORT: "7420"
      GAME_SERVER_NODE_ID: "eu-central-1"
      GAME_SERVER_NAME: "Węzeł Autorytatywny EU-Central #1"
      GAME_SERVER_REGION: "eu-central (Frankfurt)"
      GAME_SERVER_MAX_PLAYERS: "250"
      GAME_SERVER_TICK_RATE: "20"
      DATABASE_URL: "postgres://ki_owner:${OWNER_PASSWORD:-secret}@db:5432/ki_multiplayer"
    networks:
      - private
      - public_net
    depends_on:
      db:
        condition: service_healthy
    command: ["npx", "tsx", "src/server/gameServer.ts"]
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:7420/health', r => process.exit(r.statusCode===200?0:1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }

secrets:
  owner_password:
    file: ./secrets/owner_password
volumes:
  database:
networks:
  private:
    internal: true
  public_net:
    driver: bridge
