services:
  board:
    image: node:22-alpine
    container_name: ki-prompt-board
    user: "${BOARD_UID}:${BOARD_GID}"
    working_dir: /app
    command: [node, server.mjs]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      BOARD_RELEASE: ${BOARD_RELEASE}
      BOARD_ORIGIN: https://staging.kilegends.pl
      BOARD_DATA: /data
      BOARD_AUTH: /run/board-auth.json
    volumes:
      - ${BOARD_RELEASE_DIR}:/app:ro
      - ${BOARD_BASE}/data:/data
      - ${BOARD_BASE}/auth.json:/run/board-auth.json:ro
    networks: [coolify]
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 192m
          cpus: "0.5"
    logging:
      driver: json-file
      options: { max-size: 5m, max-file: "3" }
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.services.ki-prompts.loadbalancer.server.port=3000
      - traefik.http.routers.ki-prompts-https.rule=Host(`staging.kilegends.pl`) && (Path(`/`) || Path(`/prompty`) || PathPrefix(`/prompty/`))
      - traefik.http.routers.ki-prompts-https.entrypoints=https
      - traefik.http.routers.ki-prompts-https.priority=200
      - traefik.http.routers.ki-prompts-https.tls=true
      - traefik.http.routers.ki-prompts-https.tls.certresolver=letsencrypt
      - traefik.http.routers.ki-prompts-https.service=ki-prompts
      - traefik.http.routers.ki-prompts-http.rule=Host(`staging.kilegends.pl`) && (Path(`/`) || Path(`/prompty`) || PathPrefix(`/prompty/`))
      - traefik.http.routers.ki-prompts-http.entrypoints=http
      - traefik.http.routers.ki-prompts-http.priority=200
      - traefik.http.routers.ki-prompts-http.middlewares=ki-prompts-redirect
      - traefik.http.routers.ki-prompts-http.service=ki-prompts
      - traefik.http.middlewares.ki-prompts-redirect.redirectscheme.scheme=https
      - traefik.http.middlewares.ki-prompts-redirect.redirectscheme.permanent=true
networks:
  coolify:
    external: true
