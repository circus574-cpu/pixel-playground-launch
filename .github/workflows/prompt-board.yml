name: Prompt production board staging
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Read-only upload inventory or deploy the prompt panel
        type: choice
        options: [deploy, audit]
        default: deploy
  push:
    branches: [feature/prompt-production-board]
    paths: [.github/workflows/prompt-board.yml, deploy/prompt-board/**]
permissions:
  contents: read
concurrency:
  group: ki-prompt-board-staging
  cancel-in-progress: false
jobs:
  board:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: inputs.operation != 'audit'
        with:
          node-version: "22"
      - name: Test actual HTTP, persistence and authorization
        if: inputs.operation != 'audit'
        run: node --test deploy/prompt-board/server.test.mjs
      - name: Prepare isolated board bundle
        if: inputs.operation != 'audit'
        run: |
          test -s deploy/prompt-board/prompts.current.json
          tar -czf /tmp/ki-prompt-board.tar.gz -C deploy/prompt-board . -C "$GITHUB_WORKSPACE/docs/design/development-prompts" prompts.json
      - name: Deploy only prompt board on staging
        if: inputs.operation != 'audit'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.COOLIFY_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/board-key"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key"
          ssh_args=(-i "$key" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts")
          ssh "${ssh_args[@]}" codex@85.235.150.189 'mkdir -p "$HOME/ki-prompt-board/releases/${{ github.sha }}"; tar -xzf - -C "$HOME/ki-prompt-board/releases/${{ github.sha }}"' < /tmp/ki-prompt-board.tar.gz
          ssh "${ssh_args[@]}" codex@85.235.150.189 'bash "$HOME/ki-prompt-board/releases/${{ github.sha }}/deploy.sh" "${{ github.sha }}"'

      - name: Read-only prompt upload inventory
        if: inputs.operation == 'audit'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.COOLIFY_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/board-audit-key"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key"
          ssh -i "$key" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" codex@85.235.150.189 'python3 -' <<'PY'
          import json,hashlib,collections
          from pathlib import Path
          base=Path.home()/'ki-prompt-board'
          release=(base/'current-release').read_text().strip()
          release_dir=base/'releases'/release
          catalog_file=release_dir/'prompts.current.json'
          if not catalog_file.exists(): catalog_file=release_dir/'prompts.json'
          catalog=json.loads(catalog_file.read_text())
          state=json.loads((base/'data/state.json').read_text())
          rows=[{'id':key,'files':len(value.get('files',[])),'types':sorted(set(f.get('type','') for f in value.get('files',[]))),'revision':bool(value.get('revision'))} for key,value in state['prompts'].items()]
          pending=[]
          for p in catalog:
            r=state['prompts'].get(p['id'],{})
            files=[f for f in r.get('files',[]) if not r.get('revisedAt') or f.get('uploadedAt','')>r['revisedAt']]
            done=not r.get('revision') and (any(f.get('type')=='application/zip' for f in files) or len(files)>=8 if p['kind']=='animation' else bool(files))
            if not done: pending.append(p)
          verified=sum(hashlib.sha256((base/'data/files'/f['stored']).read_bytes()).hexdigest()==f['sha256'] for r in state['prompts'].values() for f in r.get('files',[]))
          backup=base/'backups'/('state-before-'+release+'.json')
          print('BOARD_AUDIT_JSON='+json.dumps({'release':release,'catalogCount':len(catalog),'pendingCount':len(pending),'kinds':dict(collections.Counter(p['kind'] for p in pending)),'uploaded':rows,'filesTotal':sum(r['files'] for r in rows),'filesVerified':verified,'backupMatches':backup.exists() and backup.read_bytes()==(base/'data/state.json').read_bytes()},ensure_ascii=False))
          PY
