name: Prompt production board staging
on:
  workflow_dispatch:
  push:
    branches: [feature/prompt-production-board]
    paths: [.github/workflows/prompt-board.yml, deploy/prompt-board/**]
permissions:
  contents: read
concurrency:
  group: ki-prompt-board-staging
  cancel-in-progress: false
jobs:
  board:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inspect staging routing without exposing secrets
        env:
          SSH_PRIVATE_KEY: ${{ secrets.COOLIFY_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/board-key"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key"
          ssh -i "$key" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" codex@85.235.150.189 'python3 -' <<'PY'
          import subprocess,json
          all=json.loads(subprocess.check_output(['docker','inspect',*subprocess.check_output(['docker','ps','-q'],text=True).split()]))
          for c in all:
            labels=c['Config'].get('Labels') or {}
            routes={k:v for k,v in labels.items() if 'traefik' in k and ('rule' in k or 'entrypoint' in k or 'certresolver' in k or 'port' in k)}
            if any('kilegends.pl' in v for v in routes.values()) or 'coolify-proxy' in c['Name']:
              print(c['Name'], c['Config']['Image'], list(c['NetworkSettings']['Networks']), routes)
            if c['Name'].startswith('/app-xh4'):
              env=dict(s.split('=',1) for s in c['Config']['Env'] if '=' in s)
              print('existing-private-page-password-configured',bool(env.get('SITE_PASSWORD')))
          PY
