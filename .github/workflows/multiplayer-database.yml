name: Private multiplayer PostgreSQL database
on:
  workflow_dispatch:
  push:
    branches: [infra/multiplayer-db-vps]
    paths: [.github/workflows/multiplayer-database.yml]
permissions:
  contents: read
concurrency:
  group: ki-multiplayer-db
  cancel-in-progress: false
jobs:
  ssh-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: deploy/multiplayer
      - name: Prepare deployment bundle
        run: tar -czf /tmp/ki-deploy-scripts.tar.gz -C deploy/multiplayer compose.yml init verify.sql install.sh
      - name: Deploy tested candidate and update existing Coolify service
        env:
          SSH_PRIVATE_KEY: ${{ secrets.COOLIFY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo '::error::Add repository Actions secret COOLIFY_SSH_KEY, then rerun this job.'
            exit 1
          fi
          umask 077
          key_file="$RUNNER_TEMP/coolify_ssh_key"
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_file"
          ssh_opts=(-i "$key_file" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$RUNNER_TEMP/coolify_known_hosts")
          ssh "${ssh_opts[@]}" codex@85.235.150.189 'umask 077; mkdir -p "$HOME/ki-multiplayer-db"; tar -xzf - -C "$HOME/ki-multiplayer-db"; bash "$HOME/ki-multiplayer-db/install.sh"' < /tmp/ki-deploy-scripts.tar.gz
