name: Publish verified KI Legends V2 PDF ZIP and art
on:
  push:
    branches: [transfer/ki-366-v2-bytes-20261029]
    paths: [.github/workflows/ki-items-v2-reassemble.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble-verify-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Assemble binary ZIP from verified Git object chunks
        shell: bash
        run: |
          set -euo pipefail
          parts=.archive-transfer/ki-v2
          out="$RUNNER_TEMP/KI_LEGENDS_PAKIET_366_PASYWNE_ARTEFAKTY_V2.zip"
          for f in part_000 part_001 part_002 part_003 part_004 part_005_0 part_005_1 part_006 part_007 part_008 part_009_0 part_009_1 part_010_0_0 part_010_0_1 part_010_1 part_011; do
            test -s "$parts/$f" || { echo "::error::Missing binary chunk $f"; exit 1; }
            cat "$parts/$f" >> "$out"
          done
          echo "2bd02649bc873001b24c655fe5023940e660bec6ae7187a1e87add10dd389852  $out" | sha256sum --check
          test "$(stat -c %s "$out")" -eq 12138736
          unzip -tq "$out"
          echo "Original binary ZIP verified, size 12138736"
      - name: Extract PDF and 15 original JPG sheets
        shell: bash
        run: |
          set -euo pipefail
          dest="$RUNNER_TEMP/ki-v2-unpacked"
          mkdir -p "$dest"
          unzip -q "$RUNNER_TEMP/KI_LEGENDS_PAKIET_366_PASYWNE_ARTEFAKTY_V2.zip" 'KI_LEGENDS_KATALOG_366_PASYWNE_BUFFY_V2.pdf' 'plansze/*.jpg' -d "$dest"
          echo "6908648750fa4526526b22a2dfc2ad53c51d8a00fa75efdf8bc51350b6a084b1  $dest/KI_LEGENDS_KATALOG_366_PASYWNE_BUFFY_V2.pdf" | sha256sum --check
          test "$(find "$dest/plansze" -maxdepth 1 -type f -name '*.jpg' | wc -l)" -eq 15
          echo "Original PDF and all 15 JPG files verified"
      - name: Commit documentation assets to current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B ki-items-v2-binary-release origin/main
          dest=docs/katalog-przedmiotow-v2
          mkdir -p "$dest/plansze"
          cp "$RUNNER_TEMP/KI_LEGENDS_PAKIET_366_PASYWNE_ARTEFAKTY_V2.zip" "$dest/"
          cp "$RUNNER_TEMP/ki-v2-unpacked/KI_LEGENDS_KATALOG_366_PASYWNE_BUFFY_V2.pdf" "$dest/"
          cp "$RUNNER_TEMP/ki-v2-unpacked/plansze/"*.jpg "$dest/plansze/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$dest"
          if git diff --cached --quiet; then
            echo "Binary catalog assets already present on main"
            exit 0
          fi
          git commit -m "docs(items): publish verified KI Legends V2 ZIP, PDF and 15 original item sheets"
          git push origin HEAD:main
