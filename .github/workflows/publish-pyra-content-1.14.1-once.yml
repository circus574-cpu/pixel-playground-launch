name: Jednorazowa publikacja paczki KI Legends 1.14.1
on:
  push:
    branches:
      - feat/pyra-terrain-prototype-20261117
    paths:
      - .github/workflows/publish-pyra-content-1.14.1-once.yml

permissions:
  contents: read
  actions: write

jobs:
  dispatch-existing-publisher:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Uruchom sprawdzony workflow publikacji paczki na VPS
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api -X POST \
            "repos/${{ github.repository }}/actions/workflows/godot-content-upload.yml/dispatches" \
            -f ref=feat/pyra-terrain-prototype-20261117 \
            -f 'inputs[version]=1.14.1' \
            -f 'inputs[publish]=true' \
            -f 'inputs[activate]=true'
          echo "Wywołano ręczny workflow pakietów: 1.14.1 (publish, activate), z gałęzi prototypu. Nie zmieniono main ani APK."
