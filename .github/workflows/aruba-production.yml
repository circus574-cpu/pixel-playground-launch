name: Ki Legends automatic Aruba deployment
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/**
      - public/**
      - art/pipeline/**
      - package*.json
      - vite.config.ts
      - Dockerfile
      - deploy/**
      - .github/workflows/aruba-production.yml
permissions:
  contents: read
concurrency:
  group: ki-legends-aruba-live
  cancel-in-progress: false
jobs:
  verify:
    name: Quality gate (typecheck, tests, lint, assets, docs, build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install project dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript (all configurations)
        run: npm run typecheck
      - name: Unit and integration tests
        run: npm run test
      - name: Lint
        run: npm run lint
      - name: Asset contract
        run: npm run assets:check
      - name: Documentation structure
        run: python3 scripts/docs/check_documentation.py
      - name: Production build
        run: npm run build
  ssh-check:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            src
            public
            scripts
            deploy
            art/pipeline
      - name: Prepare deployment bundle
        run: |
          tar -czf /tmp/ki-deploy-scripts.tar.gz -C deploy/scripts start-aruba-staging.sh promote-coolify-release.sh
          tar --exclude='.git' -czf /tmp/ki-release-source.tar.gz .
      - name: Deploy tested candidate and update existing Coolify service
        env:
          SSH_PRIVATE_KEY: ${{ secrets.COOLIFY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo '::error::Add repository Actions secret COOLIFY_SSH_KEY, then rerun this job.'
            exit 1
          fi
          umask 077
          key_file="$RUNNER_TEMP/coolify_ssh_key"
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_file"
          ssh_opts=(-i "$key_file" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$RUNNER_TEMP/coolify_known_hosts")
          ssh "${ssh_opts[@]}" codex@85.235.150.189 'mkdir -p "$HOME/ki-legends-aruba-staging/automation"; tar -xzf - -C "$HOME/ki-legends-aruba-staging/automation"; cp "$HOME/ki-legends-aruba-staging/automation/start-aruba-staging.sh" "$HOME/ki-legends-aruba-staging/deploy-candidate.sh"' < /tmp/ki-deploy-scripts.tar.gz
          ssh "${ssh_opts[@]}" codex@85.235.150.189 "rm -rf \"\$HOME/ki-legends-aruba-staging/releases/${{ github.sha }}\" && mkdir -p \"\$HOME/ki-legends-aruba-staging/releases/${{ github.sha }}\" && tar -xzf - -C \"\$HOME/ki-legends-aruba-staging/releases/${{ github.sha }}\"" < /tmp/ki-release-source.tar.gz
          ssh "${ssh_opts[@]}" codex@85.235.150.189 "bash ki-legends-aruba-staging/automation/promote-coolify-release.sh '${{ github.sha }}'"
