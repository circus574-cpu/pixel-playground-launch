name: Encrypted transfer of KI database backup
on:
  workflow_dispatch:
  push:
    branches: [fix/tigmig-domain-routing]
    paths: [.github/workflows/migration-transfer.yml]
permissions:
  contents: read
jobs:
  ssh-check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: deploy/scripts
      - name: Check SSH access and local Coolify response
        env:
          SSH_PRIVATE_KEY: ${{ secrets.COOLIFY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo '::error::Add repository Actions secret COOLIFY_SSH_KEY, then rerun this job.'
            exit 1
          fi
          umask 077
          key_file="$RUNNER_TEMP/coolify_ssh_key"
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_file"
          ssh -i "$key_file" -o BatchMode=yes -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile="$RUNNER_TEMP/coolify_known_hosts" \
            -p 22 codex@85.235.150.189 \
            'docker run --rm -v /home/gh-runner/migracja-archiwa/verified-cdbd495f/KI-LEGENDS-VPS-MIGRACJA:/source:ro alpine:3.22 tar -C /source -czf - database BRAKI-I-OGRANICZENIA.md' > "$RUNNER_TEMP/database-backup.tar.gz"
          openssl cms -encrypt -aes256 -binary -outform DER -in "$RUNNER_TEMP/database-backup.tar.gz" -out "$RUNNER_TEMP/database-backup.cms" deploy/migration-transfer-public.pem
          rm "$RUNNER_TEMP/database-backup.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-ki-database-backup
          path: ${{ runner.temp }}/database-backup.cms
          retention-days: 1
