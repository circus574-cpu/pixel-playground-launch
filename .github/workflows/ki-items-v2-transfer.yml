name: Upload KI Legends V2 archive from existing VPS
on:
  workflow_dispatch:
  push:
    branches: [ops/ki-item-archive-v2-github-action-20261029]
    paths: [.github/workflows/ki-items-v2-transfer.yml]
permissions:
  contents: write
concurrency:
  group: ki-items-v2-transfer
  cancel-in-progress: false
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Read exact archive from existing authorized VPS via SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.COOLIFY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "::error::Missing existing COOLIFY_SSH_KEY in GitHub Actions secrets"
            exit 1
          fi
          umask 077
          key_file="$RUNNER_TEMP/ki_items_v2_key"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_file"
          trap 'rm -f "$key_file"' EXIT
          opts=(-i "$key_file" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$RUNNER_TEMP/ki_known_hosts" -p 22)
          source_path=$(ssh "${opts[@]}" codex@85.235.150.189 "find /home/gh-runner -maxdepth 8 -type f -name KI_LEGENDS_PAKIET_366_PASYWNE_ARTEFAKTY_V2.zip -print -quit" | tr -d '\r')
          if [ -z "$source_path" ]; then
            echo "::error::Exact archive not found on the VPS. GitHub Actions cannot read files stored only in ChatGPT sandbox. Upload original archive to VPS, then re-run manually."
            exit 1
          fi
          ssh "${opts[@]}" codex@85.235.150.189 "cat \"$source_path\"" > "$RUNNER_TEMP/ki-items-v2.zip"
          echo "2bd02649bc873001b24c655fe5023940e660bec6ae7187a1e87add10dd389852  $RUNNER_TEMP/ki-items-v2.zip" | sha256sum --check --status
          unzip -tq "$RUNNER_TEMP/ki-items-v2.zip"
          echo "Validated original V2 archive by SHA-256"
      - name: Extract exact PDF, 15 original JPG sheets and ZIP into documentation
        shell: bash
        run: |
          set -euo pipefail
          repo_dir=docs/katalog-przedmiotow-v2
          mkdir -p "$RUNNER_TEMP/v2-assets"
          unzip -q "$RUNNER_TEMP/ki-items-v2.zip" 'KI_LEGENDS_KATALOG_366_PASYWNE_BUFFY_V2.pdf' 'plansze/*.jpg' -d "$RUNNER_TEMP/v2-assets"
          echo "3a6b0207560f90745950ac661e5a5a07f5ca31d07de36952592ab0d81c456d7d  $RUNNER_TEMP/v2-assets/KI_LEGENDS_KATALOG_366_PASYWNE_BUFFY_V2.pdf" | sha256sum --check --status
          count=$(find "$RUNNER_TEMP/v2-assets/plansze" -maxdepth 1 -type f -name '*.jpg' | wc -l)
          [ "$count" -eq 15 ] || { echo "::error::Expected 15 JPGs, found $count"; exit 1; }
          mkdir -p "$repo_dir/plansze"
          cp "$RUNNER_TEMP/v2-assets/KI_LEGENDS_KATALOG_366_PASYWNE_BUFFY_V2.pdf" "$repo_dir/"
          cp "$RUNNER_TEMP/v2-assets/plansze/"*.jpg "$repo_dir/plansze/"
          cp "$RUNNER_TEMP/ki-items-v2.zip" "$repo_dir/KI_LEGENDS_PAKIET_366_PASYWNE_ARTEFAKTY_V2.zip"
          echo "Prepared 1 ZIP, 1 PDF and 15 JPG files; no game code modified"
      - name: Publish documentation-only files to main
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ki-v2-payload"
          cp docs/katalog-przedmiotow-v2/KI_LEGENDS_KATALOG_366_PASYWNE_BUFFY_V2.pdf "$RUNNER_TEMP/ki-v2-payload/"
          cp docs/katalog-przedmiotow-v2/KI_LEGENDS_PAKIET_366_PASYWNE_ARTEFAKTY_V2.zip "$RUNNER_TEMP/ki-v2-payload/"
          cp -a docs/katalog-przedmiotow-v2/plansze "$RUNNER_TEMP/ki-v2-payload/"
          git fetch origin main
          git checkout -B ki-v2-publish origin/main
          mkdir -p docs/katalog-przedmiotow-v2/plansze
          cp "$RUNNER_TEMP/ki-v2-payload/"*.pdf "$RUNNER_TEMP/ki-v2-payload/"*.zip docs/katalog-przedmiotow-v2/
          cp "$RUNNER_TEMP/ki-v2-payload/plansze/"*.jpg docs/katalog-przedmiotow-v2/plansze/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/katalog-przedmiotow-v2
          if git diff --cached --quiet; then echo "Already uploaded"; exit 0; fi
          git commit -m "docs(items): include original V2 PDF, JPG artwork and verified ZIP"
          git push origin HEAD:main
