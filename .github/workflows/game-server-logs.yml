name: Game server logs (read only)
on:
  workflow_dispatch:
    inputs:
      since:
        description: "How far back to read logs (docker --since), e.g. 6h"
        required: false
        default: 6h
permissions:
  contents: read
concurrency:
  group: game-server-logs
  cancel-in-progress: false
jobs:
  logs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read game-server rejection reasons over authorized SSH (no restart, no changes)
        env:
          SSH_PRIVATE_KEY: ${{ secrets.COOLIFY_SSH_KEY }}
          SINCE: ${{ inputs.since }}
        shell: bash
        run: |
          set -euo pipefail
          [ -n "$SSH_PRIVATE_KEY" ] || { echo '::error::Missing COOLIFY_SSH_KEY'; exit 1; }
          case "$SINCE" in *[!0-9smhd]*|"") echo '::error::Bad since value'; exit 1;; esac
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/key"
          ssh -i "$RUNNER_TEMP/key" -o BatchMode=yes -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" \
            codex@85.235.150.189 "SINCE='$SINCE' bash -s" <<'REMOTE'
          set -u
          echo "== Kontenery (nazwa | obraz | stan)"
          docker ps --format '{{.Names}} | {{.Image}} | {{.Status}}'
          for c in $(docker ps --format '{{.Names}}'); do
            n=$(docker logs --since "$SINCE" "$c" 2>&1 | grep -c -E "\\[Online\\]" || true)
            [ "${n:-0}" -gt 0 ] || continue
            echo "== Kontener z logami [Online]: $c ($n linii)"
            docker inspect -f 'obraz={{.Config.Image}} start={{.State.StartedAt}}' "$c"
            echo "-- Odrzucone pakiety (ostatnie $SINCE)"
            docker logs --since "$SINCE" "$c" 2>&1 | grep -E "Odrzucono pakiet|SESSION_BUSY|mismatch|REJECTED|INVALID" | cut -c1-300 | tail -40 || true
            echo "-- Ostatnie linie [Online]"
            docker logs --since "$SINCE" "$c" 2>&1 | grep -E "\\[Online\\]" | cut -c1-300 | tail -30 || true
          done
          REMOTE
