name: Godot Pyra city prototype
on:
  pull_request:
    branches: [main]
    paths:
      - ports/godot-pyra/**
      - ports/godot-isometric-pyra/**
      - scripts/godot/**
      - src/test/godot-pyra-export.test.ts
      - .github/workflows/godot-pyra.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: godot-pyra-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Prepare the namespaced isometric service preview
        run: |
          git lfs pull --include='ports/godot-isometric-pyra/**'
          python3 scripts/godot/prepare_service_preview.py
      - name: Install pinned Godot 4.6.3
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 -o "$RUNNER_TEMP/godot.zip" https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          printf '%s  %s\n' d0bc2113065e481c9c2c2b2c37daa4e8be3fe9e27f0ab9ab0b6096e9a37907f3 "$RUNNER_TEMP/godot.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/godot"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          mv "$RUNNER_TEMP/godot/Godot_v4.6.3-stable_linux.x86_64" "$RUNNER_TEMP/godot/godot"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri
      - name: Import actual city assets and scripts
        run: |
          mkdir -p godot-qa
          godot --headless --editor --path ports/godot-pyra --import > godot-qa/import.txt 2>&1
          if grep -E 'SCRIPT ERROR:|^ERROR:' godot-qa/import.txt; then exit 1; fi
      - name: Headless physics and input integration
        run: timeout 180s godot --headless --audio-driver Dummy --path ports/godot-pyra --script res://tests/smoke.gd -- --fresh --qa-output "$GITHUB_WORKSPACE/godot-qa/headless" > godot-qa/headless.txt 2>&1
      - name: Service preview, private world and unchanged saves
        run: |
          timeout 180s xvfb-run -a -s '-screen 0 1600x900x24' env LIBGL_ALWAYS_SOFTWARE=1 godot --audio-driver Dummy --rendering-method gl_compatibility --path ports/godot-pyra --script res://tests/service_preview.gd -- --qa-output="$GITHUB_WORKSPACE/godot-qa/service" > godot-qa/service.txt 2>&1
          python3 - <<'PY'
          import json, pathlib
          result = json.loads(pathlib.Path('godot-qa/service/results.json').read_text())
          assert result['failed'] == 0 and result['passed'] >= 21, result
          text = pathlib.Path('godot-qa/service.txt').read_text()
          assert 'SCRIPT ERROR:' not in text and '\nERROR:' not in text
          PY
      - name: Mobile HUD, minimap and staff access
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --audio-driver Dummy --path ports/godot-pyra --script res://tests/hud_mobile.gd -- --qa-output "$GITHUB_WORKSPACE/godot-qa/hud-headless" > godot-qa/hud-headless.txt 2>&1
          xvfb-run -a -s '-screen 0 1600x900x24' env LIBGL_ALWAYS_SOFTWARE=1 godot --audio-driver Dummy --path ports/godot-pyra --script res://tests/hud_mobile.gd -- --qa-output "$GITHUB_WORKSPACE/godot-qa/hud-native" > godot-qa/hud-native.txt 2>&1
          xvfb-run -a -s '-screen 0 1600x900x24' env LIBGL_ALWAYS_SOFTWARE=1 godot --audio-driver Dummy --path ports/godot-pyra --script res://tests/qa_mobile_game.gd -- --fresh --qa-output "$GITHUB_WORKSPACE/godot-qa/hud-game" > godot-qa/hud-game.txt 2>&1
          xvfb-run -a -s '-screen 0 1600x900x24' env LIBGL_ALWAYS_SOFTWARE=1 godot --audio-driver Dummy --path ports/godot-pyra --script res://tests/gm_gameplay.gd -- --fresh --qa-output "$GITHUB_WORKSPACE/godot-qa/gm-gameplay" > godot-qa/gm-gameplay.txt 2>&1
          python3 - <<'PY'
          import json, pathlib
          for mode, count in [('hud-headless', 42), ('hud-native', 42), ('hud-game', 5), ('gm-gameplay', 58)]:
              result = json.loads(pathlib.Path('godot-qa', mode, 'result.json').read_text())
              assert result['failed'] == 0 and result['checks'] >= count, result
          PY
      - name: Actual Godot OpenGL render and gameplay
        run: timeout 180s xvfb-run -a -s '-screen 0 1600x900x24' env LIBGL_ALWAYS_SOFTWARE=1 godot --audio-driver Dummy --path ports/godot-pyra --rendering-method gl_compatibility --script res://tests/smoke.gd -- --fresh --qa-output "$GITHUB_WORKSPACE/godot-qa/native" > godot-qa/native.txt 2>&1
      - name: Validate gameplay, runtime errors and existing shutdown-leak budget
        shell: bash
        run: |
          python3 - <<'PY'
          import json, pathlib, re
          base = pathlib.Path('godot-qa')
          for mode in ('headless', 'native'):
              r = json.loads((base / mode / 'result.json').read_text())
              assert r['failed'] == 0 and r['checks'] >= 543, r
          assert list((base / 'native').glob('*.png'))

          # These allocations are present on both the original PR and the
          # previous Godot 4.6.3 baseline. They are unresolved, NOT clean
          # shutdowns. Fail on any growth or an error outside this narrow list.
          limits = {
              'headless': {'dummy': 42, 'gl': 0, 'gles': 0, 'text': 66, 'font': 1, 'canvas': 8},
              'native':   {'dummy': 0, 'gl': 43, 'gles': 43, 'text': 66, 'font': 1, 'canvas': 8},
          }
          rid_kinds = {
              'PN13RendererDummy14TextureStorage12DummyTextureE': 'dummy',
              'N5GLES37TextureE': 'gles',
              'PN18TextServerAdvanced22ShapedTextDataAdvancedE': 'text',
              'PN18TextServerAdvanced12FontAdvancedE': 'font',
          }
          for log in base.glob('*.txt'):
              content = log.read_text()
              assert 'SCRIPT ERROR:' not in content, str(log)
              if log.stem not in limits:
                  assert not re.search(r'^ERROR:', content, re.M), str(log)
                  continue
              marker = 'PYRA GODOT QA: 543/543 failed: []'
              assert marker in content, str(log)
              before, after = content.split(marker, 1)
              assert not re.search(r'^ERROR:', before, re.M), str(log)
              actual = {key: 0 for key in limits[log.stem]}
              for line in after.splitlines():
                  if not line.startswith('ERROR:'):
                      continue
                  if re.fullmatch(r'ERROR: Texture with GL ID of \d+: leaked \d+ bytes\.', line):
                      actual['gl'] += 1
                      continue
                  rid = re.fullmatch(r"ERROR: (\d+) RID allocations of type '([^']+)' were leaked at exit\.", line)
                  assert rid and rid.group(2) in rid_kinds, (str(log), line)
                  actual[rid_kinds[rid.group(2)]] += int(rid.group(1))
              canvas = re.findall(r'^WARNING: (\d+) RIDs of type "CanvasItem" were leaked\.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: godot-pyra-${{ github.sha }}
          path: godot-qa
          retention-days: 14
, after, re.M)
              assert len(canvas) <= 1, str(log)
              actual['canvas'] = int(canvas[0]) if canvas else 0
              for kind, budget in limits[log.stem].items():
                  assert actual[kind] <= budget, (str(log), kind, actual[kind], budget)
              if any(actual.values()):
                  print(f"::warning::{log.name}: known Godot 4.6.3 shutdown allocations remain: {actual}; runtime assertions and engine errors before shutdown are clean")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: godot-pyra-${{ github.sha }}
          path: godot-qa
          retention-days: 14
