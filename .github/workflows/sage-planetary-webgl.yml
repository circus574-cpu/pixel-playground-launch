name: Sage and Planetary WebGL regressions

on:
  pull_request:
    paths:
      - ".github/workflows/sage-planetary-webgl.yml"
      - "src/game/assets/**"
      - "src/test/**"
      - "e2e/**"
      - "public/game/assets/gpu/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  webgl:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"
      KI_QA_WEBGL: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Both GPU heroes in software WebGL
        run: npx playwright test e2e/gpu-webgl-smoke.spec.ts
      - name: Failure traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sage-planetary-webgl-failures
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
